[workspace]
resolver = "3"
members = ["crates/ride-core", "crates/ride"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/ride"

[workspace.dependencies]
ride-core = { path = "crates/ride-core" }

# In debug l'editor resta reattivo: ottimizzo le dipendenze (egui/syntect) ma
# lascio il nostro codice non ottimizzato per avere build veloci e buon debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
